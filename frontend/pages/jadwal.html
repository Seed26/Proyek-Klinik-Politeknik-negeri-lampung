<!-- Page: Jadwal Dokter (Admin & Patient) -->
<section class="page" id="page-jadwal">
  <div class="page-heading">
    <div>
      <p class="eyebrow">JADWAL PRAKTEK DOKTER</p>
      <h1 id="jadwal-title">Jadwal Dokter</h1>
      <p class="muted" id="jadwal-subtitle">Lihat jadwal praktek dokter yang tersedia di Klinik Polinela.</p>
    </div>
    <button id="add-schedule-btn" class="btn primary hidden">＋ Tambah Jadwal</button>
  </div>

  <article class="panel">
    <div class="panel-heading section-tools">
      <div>
        <h2 id="jadwal-list-heading">Daftar Jadwal Praktek</h2>
        <p class="muted" id="jadwal-list-desc">Daftar dokter dan jam layanan klinik.</p>
      </div>
    </div>
    <!-- Admin View: Tabel Manajemen Jadwal -->
    <div id="jadwal-admin-table" class="table-wrap hidden">
      <table>
        <thead>
          <tr>
            <th>Dokter</th>
            <th>Poli</th>
            <th>Hari</th>
            <th>Jam Praktek</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="admin-jadwal-body"></tbody>
      </table>
    </div>
    <!-- Patient View: Grid Kartu Jadwal Dokter -->
    <div id="jadwal-patient-grid" class="patient-home-schedule-grid hidden" style="padding: 1rem 0;"></div>
  </article>
</section>
